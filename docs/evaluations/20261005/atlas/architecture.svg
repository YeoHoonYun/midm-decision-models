   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8667a7" x="17.568" y="100.8288" transform="rotate(-0 17.568 100.8288)">CLM reference 8B</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(84.348422 139.348092)">State and candidates</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(88.289203 151.105795)">encoded separately</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(372.084923 139.348092)">Frozen Qwen3-8B</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(357.982111 151.105795)">last-token embeddings</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(643.316738 139.348092)">Two projection MLPs</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(661.416113 151.105795)">state / action</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(922.092966 139.348092)">Scaled cosine score</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(935.794645 151.105795)">rank / softmax</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #657580" x="17.568" y="190.8" transform="rotate(-0 17.568 190.8)">Independent embedding reuse is possible; released task-specific heads are separate artifacts.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f86" x="17.568" y="224.3808" transform="rotate(-0 17.568 224.3808)">MiDM 4B / 9B</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(89.873227 262.900092)">State + question +</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(87.662484 274.657795)">ordered option lines</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(367.90297 262.900092)">Causal base in NF4</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(376.989572 274.657795)">+ rank-16 LoRA</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(655.439316 262.900092)">Hidden state at</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(653.490253 274.657795)">each option end</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(918.397458 262.900092)">Shared linear pointer</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(918.261286 274.657795)">softmax over options</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #657580" x="17.568" y="314.352" transform="rotate(-0 17.568 314.352)">One causal pass: later options see earlier options, not vice versa. This is not bidirectional attention.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c56a23" x="17.568" y="347.9328" transform="rotate(-0 17.568 347.9328)">Generative reasoning</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(89.873227 386.452092)">State + question +</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(93.435844 398.209795)">candidate prompt</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(355.736916 386.452092)">Autoregressive decoder</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(349.089103 398.209795)">reasoning / answer tokens</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(652.924238 386.452092)">Parse generated</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(639.3858 398.209795)">answer or tool output</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(939.783005 386.452092)">Typed choice</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #283a47" transform="translate(924.430856 398.209795)">with parser checks</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #657580" x="17.568" y="437.904" transform="rotate(-0 17.568 437.904)">More decoding work; a higher accuracy does not imply equivalent latency, cost or parameter disclosure.</text>
   </g>
  </g>
  <g id="text_19">
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #283a47" x="554.4" y="20.877187" transform="rotate(-0 554.4 20.877187)">Architecture comparison: how a bounded decision is produced</text>
  </g>
 </g>
